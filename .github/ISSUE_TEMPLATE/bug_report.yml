name: Bug Report
description: File a bug report for Ruas code intelligence engine
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please describe the problem as clearly as possible.
  - type: input
    id: version
    attributes:
      label: Ruas Version
      placeholder: e.g. 0.1.0 (run `ruas --version`)
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      placeholder: e.g. v22.13.0 (run `node --version`)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Code snippet, CLI command, or query that reproduces the issue.
      placeholder: |
        1. ruas index .
        2. ruas ask "..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
